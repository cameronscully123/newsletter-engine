name: Sync Blog from Notion

on:
  schedule:
    - cron: '0 * * * *'   # runs every hour
  workflow_dispatch:        # also lets you click "Run workflow" manually in GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync posts from Notion
        run: node scripts/sync-notion.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/
          git diff --cached --quiet || git commit -m "blog: sync from Notion [skip ci]"
          git push
